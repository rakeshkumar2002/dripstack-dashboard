name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Typecheck + build
    runs-on: ubuntu-latest
    env:
      # Build-time fallback ONLY. The real origin is injected at runtime via
      # DASHBOARD_API_URL (app/layout.tsx), so this stays at the localhost
      # default to keep the image environment-agnostic.
      NEXT_PUBLIC_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      # The backend redirects into these routes (dripstack-backend:
      # api/routes/sso.py, api/routes/admin.py, worker/activities.py). Renaming
      # or deleting one breaks SSO or notification links with no compile error
      # on either side of the split.
      - name: Cross-repo route contract
        run: |
          for p in "app/sso/callback/page.tsx" "app/login/page.tsx" \
                   "app/integrations/page.tsx" "app/runs/[id]/page.tsx"; do
            test -f "$p" || { echo "::error::contract route missing: $p"; exit 1; }
          done

  image:
    name: Build + push arm64 image
    # arm64 native, NOT ubuntu-latest: the deploy target is a t4g.small
    # (Graviton). An amd64 image pushed here fails on the box with a bare
    # "exec format error" at container start and nowhere earlier.
    runs-on: ubuntu-24.04-arm
    needs: build
    permissions:
      contents: read
      id-token: write        # OIDC — no AWS keys stored in the repo
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: AWS credentials (OIDC)
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: ECR login
        if: github.event_name == 'push'
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ vars.ECR_REGISTRY }}/dripstack-dashboard
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The entrypoint must refuse to start without DASHBOARD_API_URL — that
      # guard is the only thing standing between a misconfigured deploy and a
      # dashboard that silently calls localhost from every user's browser.
      - name: Smoke — entrypoint guard fires
        if: github.event_name == 'pull_request'
        run: |
          IMG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          if docker run --rm -e NODE_ENV=production "$IMG" node -e ''; then
            echo "::error::entrypoint did not fail with DASHBOARD_API_URL unset"; exit 1
          fi

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    # Serialise this repo's deploys. The backend repo has its own group, so
    # box-deploy.sh also takes a flock for the cross-repo case.
    concurrency:
      group: deploy-ec2
      cancel-in-progress: false
    steps:
      - name: AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}
      # SSM Run Command, not SSH: the box's security group admits a single home
      # IP, and hosted runners have no stable egress address to allow-list.
      # Nothing inbound is opened; the agent polls SSM outbound.
      - name: Deploy via SSM
        env:
          INSTANCE: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          # Deploy the immutable sha tag, never :latest — this is the only way
          # to know afterwards which build is actually serving traffic.
          # Must match docker/metadata-action's type=sha,format=long output.
          TAG="sha-${{ github.sha }}"
          CMD=$(aws ssm send-command \
            --instance-ids "$INSTANCE" \
            --document-name AWS-RunShellScript \
            --comment "dashboard ${GITHUB_SHA::7}" \
            --parameters "commands=[\"bash /home/ec2-user/box-deploy.sh dashboard $TAG\"]" \
            --query 'Command.CommandId' --output text)
          echo "ssm command: $CMD"
          # NOT `aws ssm wait command-executed`: that waiter gives up after
          # ~100s, while box-deploy.sh allows 150s for /ready alone — it would
          # report failure on a deploy that was still healthy and in progress.
          for _ in $(seq 1 72); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done
          aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE" \
            --query 'StandardOutputContent' --output text
          if [ "$STATUS" != "Success" ]; then
            echo "::error::deploy failed ($STATUS)"
            aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE" \
              --query 'StandardErrorContent' --output text
            exit 1
          fi
